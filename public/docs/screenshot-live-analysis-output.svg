  <rect x="595" y="418" width="175" height="34" rx="8" fill="#262626"/>
  <text x="682" y="439" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Copy Master Prompt (C)</text>

  <rect x="780" y="418" width="140" height="34" rx="8" fill="#76B900"/>
  <text x="850" y="439" text-anchor="middle" fill="#0B0F17" font-family="sans-serif" font-size="12" font-weight="700">Copy Full Output</text>

  <!-- Direct Unboxed Output Text -->
  <text x="180" y="482" fill="#76B900" font-family="sans-serif" font-size="15" font-weight="700">### A. Quick Summary</text>
  <text x="180" y="504" fill="#F3F4F6" font-family="sans-serif" font-size="13">Macro photorealistic close-up of an open-casework Swiss mechanical chronograph movement</text>
  <text x="180" y="524" fill="#F3F4F6" font-family="sans-serif" font-size="13">with brushed brass gear trains, Côtes de Genève steel bridges, and synthetic ruby bearings...</text>

  <text x="180" y="558" fill="#76B900" font-family="sans-serif" font-size="15" font-weight="700">### B. Detailed Breakdown (1–10)</text>
  <text x="180" y="580" fill="#D1D5DB" font-family="sans-serif" font-size="13">1. Frame and Composition: 4:3 landscape macro, three-quarter oblique angle, shallow DoF...</text>
  <text x="180" y="600" fill="#D1D5DB" font-family="sans-serif" font-size="13">2. Characters: 0 persons present. 3. Objects: Brushed brass escapement wheel, blued screws...</text>
  <text x="180" y="620" fill="#D1D5DB" font-family="sans-serif" font-size="13">4. Written Text: Engraved "SWISS MADE" &amp; "27 JEWELS" on central bridge. 5. Colours: #141821...</text>

  <text x="180" y="654" fill="#76B900" font-family="sans-serif" font-size="15" font-weight="700">### C. Final Master Prompt</text>
  <text x="180" y="676" fill="#FFFFFF" font-family="sans-serif" font-size="13">Ultra-sharp macrohorology photograph, three-quarter oblique close-up angle, intricate exposed</text>
  <text x="180" y="696" fill="#FFFFFF" font-family="sans-serif" font-size="13">Swiss mechanical watch movement with interlocking brushed brass gears (approx. #D49B4B),</text>
  <text x="180" y="716" fill="#FFFFFF" font-family="sans-serif" font-size="13">rhodium-plated steel bridges engraved with "SWISS MADE", crimson ruby bearings (#9B1B30)...</text>

  <text x="180" y="750" fill="#76B900" font-family="sans-serif" font-size="15" font-weight="700">### D. Negative Prompt  •  ### E. Short Version  •  ### F. Uncertainty Notes</text>
  <text x="180" y="772" fill="#9CA3AF" font-family="sans-serif" font-size="12">Complete structured A–F sections streamed live directly onto the page with zero box clutter.</text>

  <!-- Footer Attribution -->
  <text x="550" y="828" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="14" font-weight="500">Developed by Rehan...🌻</text>
</svg>
