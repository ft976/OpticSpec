  <rect x="180" y="366" width="175" height="32" rx="8" fill="#262626"/>
  <text x="267" y="386" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="500">Upload Different Image</text>

  <rect x="765" y="366" width="110" height="32" rx="8" fill="#171717" stroke="#262626"/>
