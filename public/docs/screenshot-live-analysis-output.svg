  <rect x="180" y="62" width="32" height="32" rx="8" fill="#111723" stroke="#262626" stroke-width="1.5"/>
  <circle cx="196" cy="78" r="4.5" stroke="#F8FAFC" stroke-width="2"/>
  <circle cx="196" cy="78" r="1.8" fill="#76B900"/>
  <text x="224" y="84" fill="#FFFFFF" font-family="sans-serif" font-size="19" font-weight="700">OpticSpec</text>
  <text x="324" y="84" fill="#9CA3AF" font-family="sans-serif" font-size="14">Image to Prompt</text>

  <!-- Uploaded Image Preview Card -->
  <rect x="310" y="130" width="480" height="220" rx="14" fill="#111723" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Stylized Watch Movement Graphic Inside Preview -->
  <circle cx="550" cy="240" r="78" fill="#161F30" stroke="#D49B4B" stroke-width="2.5"/>
  <circle cx="550" cy="240" r="46" fill="#0B0F17" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="550" cy="240" r="14" fill="#E11D48"/>
  <circle cx="510" cy="215" r="20" stroke="#D49B4B" stroke-width="2"/>
